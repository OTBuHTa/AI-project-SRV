name: API CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints/ci-py312-linux.txt
            apps/api/constraints/build-ci-py312-linux.txt

      - name: Install API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci-py312-linux.txt --build-constraint constraints/build-ci-py312-linux.txt -e ".[dev]"

      - name: Check dependency integrity
        run: |
          python -m pip check

      - name: Verify exact CI dependency baseline
        run: |
          python scripts/verify_ci_constraints.py

      - name: Verify release metadata
        run: |
          python scripts/verify_release_metadata.py

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests scripts

      - name: Run critical lint checks
        run: |
          ruff check app tests scripts --select E9,F401,F402,F403,F404,F405,F406,F63,F7,F722,F811,F82,F821,F822,F823,F842,F901

      - name: Run API tests
        run: |
          pytest -q

      - name: Check whitespace errors
        working-directory: .
        run: |
          git diff --check

  image-provenance:
    name: Docker / build identity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve checked-out revision
        id: revision
        run: |
          revision="$(git rev-parse HEAD)"
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          echo "Checked-out revision: $revision"

      - name: Build API image with revision
        working-directory: apps/api
        run: |
          docker build \
            --build-arg "APP_BUILD_REVISION=${{ steps.revision.outputs.sha }}" \
            --tag ai-project-srv-api:ci \
            .

      - name: Verify image build identity
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          label_revision="$(
            docker image inspect \
              ai-project-srv-api:ci \
              --format "{{ index .Config.Labels \"org.opencontainers.image.revision\" }}"
          )"

          env_revision="$(
            docker image inspect \
              ai-project-srv-api:ci \
              --format "{{range .Config.Env}}{{println .}}{{end}}" \
              | sed -n "s/^APP_BUILD_REVISION=//p"
          )"

          echo "EXPECTED=$EXPECTED_REVISION"
          echo "LABEL=$label_revision"
          echo "ENV=$env_revision"

          test "${#EXPECTED_REVISION}" -eq 40
          test "$label_revision" = "$EXPECTED_REVISION"
          test "$env_revision" = "$EXPECTED_REVISION"
