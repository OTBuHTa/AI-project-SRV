services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisrv
      POSTGRES_USER: aisrv
      POSTGRES_PASSWORD: aisrv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisrv -d aisrv"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ./apps/api
      args:
        APP_BUILD_REVISION: ${AI_SRV_BUILD_REVISION:-unknown}
    env_file:
      - ${AI_SRV_ENV_FILE:-.env}
    environment:
      FORWARDED_ALLOW_IPS: "172.30.0.2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
      - backup_data:/var/lib/ai-project-srv/backups
      - ${BACKUP_NAS_HOST_PATH:-/tmp/ai-project-srv-nas}:/mnt/ai-project-srv-backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      proxy:
        ipv4_address: 172.30.0.3



  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      proxy:
        ipv4_address: 172.30.0.2

  backup-scheduler:
    build:
      context: ./apps/api
      args:
        APP_BUILD_REVISION: ${AI_SRV_BUILD_REVISION:-unknown}
    command:
      - python
      - -m
      - app.services.backup_scheduler_worker
    restart: unless-stopped
    env_file:
      - ${AI_SRV_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backup_data:/var/lib/ai-project-srv/backups
      - ${BACKUP_NAS_HOST_PATH:-/tmp/ai-project-srv-nas}:/mnt/ai-project-srv-backups

  backup-alert-delivery:
    build:
      context: ./apps/api
      args:
        APP_BUILD_REVISION: ${AI_SRV_BUILD_REVISION:-unknown}
    command:
      - python
      - -m
      - app.services.backup_alert_delivery_worker
    restart: unless-stopped
    env_file:
      - ${AI_SRV_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  agent-lifecycle-alert-delivery:
    build:
      context: ./apps/api
      args:
        APP_BUILD_REVISION: ${AI_SRV_BUILD_REVISION:-unknown}
    command:
      - python
      - -m
      - app.services.agent_lifecycle_alert_delivery_worker
    restart: unless-stopped
    env_file:
      - ${AI_SRV_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup-verifier:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aisrv
      PGPASSWORD: aisrv
      PGDATABASE: postgres
      EXPECTED_REVISION: 0007_backup_pipeline
      MIN_TABLE_COUNT: "17"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backup_data:/backups
      - ./infrastructure/backup/verify_restore.sh:/usr/local/bin/verify_restore:ro
    entrypoint: ["/usr/local/bin/verify_restore"]

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/29

volumes:
  postgres_data:
  redis_data:
  backup_data:
