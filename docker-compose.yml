services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aisrv
      POSTGRES_USER: aisrv
      POSTGRES_PASSWORD: aisrv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisrv -d aisrv"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
      - backup_data:/var/lib/ai-project-srv/backups
      - ${BACKUP_NAS_HOST_PATH:-/tmp/ai-project-srv-nas}:/mnt/ai-project-srv-backups
    extra_hosts:
      - "host.docker.internal:host-gateway"



  backup-scheduler:
    build:
      context: ./apps/api
    command:
      - python
      - -m
      - app.services.backup_scheduler_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backup_data:/var/lib/ai-project-srv/backups
      - ${BACKUP_NAS_HOST_PATH:-/tmp/ai-project-srv-nas}:/mnt/ai-project-srv-backups

  backup-verifier:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aisrv
      PGPASSWORD: aisrv
      PGDATABASE: postgres
      EXPECTED_REVISION: 0007_backup_pipeline
      MIN_TABLE_COUNT: "17"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backup_data:/backups
      - ./infrastructure/backup/verify_restore.sh:/usr/local/bin/verify_restore:ro
    entrypoint: ["/usr/local/bin/verify_restore"]

volumes:
  postgres_data:
  redis_data:
  backup_data:
